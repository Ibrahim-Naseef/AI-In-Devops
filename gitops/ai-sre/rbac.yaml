apiVersion: v1
kind: ServiceAccount
metadata: {name: ai-sre-agent, namespace: ai-sre}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata: {name: ai-sre-readonly}
rules:   # READ-ONLY. No create/update/delete, no secrets.
  - apiGroups: [""]
    resources: [pods, pods/log, events, namespaces]
    verbs: [get, list, watch]
  - apiGroups: [argoproj.io]
    resources: [rollouts, analysisruns]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata: {name: ai-sre-readonly}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: ai-sre-readonly}
subjects:
  - {kind: ServiceAccount, name: ai-sre-agent, namespace: ai-sre}
