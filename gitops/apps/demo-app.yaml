apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: demo-app
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/__GH_USER__/__GH_REPO__.git
    targetRevision: main
    path: gitops/charts/demo-app
  destination:
    server: https://kubernetes.default.svc
    namespace: demo
  syncPolicy:
    automated: {prune: true, selfHeal: true}
    syncOptions: [CreateNamespace=true, SkipDryRunOnMissingResource=true]
    retry:   # CRDs (Rollouts, ServiceMonitor) may not exist yet on first sync
      limit: 15
      backoff: {duration: 30s, factor: 2, maxDuration: 5m}
