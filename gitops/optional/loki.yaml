# Optional (adds ~600MB RAM). Move to gitops/apps/ to enable log panels in Grafana.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: loki-stack
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://grafana.github.io/helm-charts
    chart: loki-stack
    targetRevision: "2.10.x"
    helm:
      valuesObject:
        loki: {persistence: {enabled: false}}
        promtail: {enabled: true}
        grafana: {enabled: false}
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated: {prune: true, selfHeal: true}
    syncOptions: [CreateNamespace=true]
# Then add to kube-prometheus-stack valuesObject:
#   grafana.additionalDataSources: [{name: Loki, type: loki, url: "http://loki.monitoring.svc:3100"}]
