apiVersion: v1
kind: Service
metadata:
  name: demo-app
  labels: {app: demo-app}
spec:
  type: {{ .Values.service.type }}
  selector: {app: demo-app}
  ports:
    - name: http
      port: 8080
      targetPort: http
{{- if eq .Values.service.type "NodePort" }}
      nodePort: {{ .Values.service.nodePort }}
{{- end }}
