apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: demo-app
  labels: {app: demo-app}
spec:
  replicas: {{ .Values.replicas }}
  revisionHistoryLimit: 3
  selector:
    matchLabels: {app: demo-app}
  strategy:
    canary:
      canaryMetadata: {labels: {role: canary}}
      stableMetadata: {labels: {role: stable}}
      steps:
        - setWeight: 25
        - pause: {duration: 20s}
{{- if .Values.analysis.enabled }}
        - analysis:
            templates:
              - templateName: ai-canary-verdict
{{- end }}
        - setWeight: 60
        - pause: {duration: 20s}
  template:
    metadata:
      labels: {app: demo-app}
    spec:
      containers:
        - name: app
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          ports: [{name: http, containerPort: 8080}]
          env:
            - {name: APP_VERSION, value: {{ .Values.image.tag | quote }}}
{{- range $k, $v := .Values.env }}
            - name: {{ $k }}
              value: {{ $v | quote }}
{{- end }}
          readinessProbe: {httpGet: {path: /healthz, port: http}, periodSeconds: 5}
          livenessProbe: {httpGet: {path: /healthz, port: http}, periodSeconds: 10, initialDelaySeconds: 10}
          resources:
{{ toYaml .Values.resources | indent 12 }}
