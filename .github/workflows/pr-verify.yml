name: pr-verify
# Verify-before-merge: deploys the PR's Helm chart to a throw-away namespace on the kind cluster.
on:
  pull_request:
    paths: ["gitops/charts/demo-app/**"]
permissions:
  contents: read
  pull-requests: write

jobs:
  preview:
    if: github.event.pull_request.head.repo.full_name == github.repository   # never run fork code on the runner
    runs-on: [self-hosted, linux]
    steps:
      - uses: actions/checkout@v4
      - name: Deploy preview, load test, report
        id: verify
        continue-on-error: true
        run: ./scripts/verify-preview.sh "${{ github.event.number }}" > report.md
      - name: Comment on PR
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.existsSync('report.md') && fs.readFileSync('report.md','utf8').trim()
              ? fs.readFileSync('report.md','utf8') : '### Preview verification: **FAIL**\nNo report produced.';
            await github.rest.issues.createComment({owner: context.repo.owner, repo: context.repo.repo,
              issue_number: context.issue.number, body});
      - name: Fail if verification failed
        if: steps.verify.outcome == 'failure'
        run: exit 1
